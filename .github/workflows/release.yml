name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install . -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build history config pack
        run: python packaging/build_history_pack.py

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller build
        run: pyinstaller sudan.spec --noconfirm

      - name: Create zip
        shell: bash
        run: |
          cd dist
          7z a -tzip "../SuDanModMerger-Windows-V${{ steps.version.outputs.version }}.zip" SuDanModMerger/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: SuDanModMerger-Windows-V*.zip

  build-macos:
    runs-on: macos-14
    env:
      CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install . -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build history config pack
        run: python packaging/build_history_pack.py

      - name: Generate macOS icon
        run: |
          mkdir -p app.iconset
          sips -s format png app.ico --out app_icon.png 2>/dev/null || cp app.ico app_icon.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size app_icon.png --out "app.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            if [ $double -le 1024 ]; then
              sips -z $double $double app_icon.png --out "app.iconset/icon_${size}x${size}@2x.png"
            fi
          done
          iconutil -c icns app.iconset -o app.icns

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller build
        run: pyinstaller sudan_macos.spec --noconfirm

      - name: Create zip
        run: |
          cd dist
          zip -r "../SuDanModMerger-macOS-V${{ steps.version.outputs.version }}.zip" SuDanModMerger.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: SuDanModMerger-macOS-V*.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "[v${{ steps.version.outputs.version }}] Mod 冲突合并工具" \
            --generate-notes \
            artifacts/windows-build/*.zip \
            artifacts/macos-build/*.zip

      - name: Create Gitee Release
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="[v${VERSION}] Mod 冲突合并工具"

          # 创建 Release
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/fentende125/sutan-game/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TITLE}\",
              \"body\": \"CI 自动发布 v${VERSION}\",
              \"target_commitish\": \"master\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "422" ]; then
            echo "Gitee Release ${TAG} 已存在，跳过创建"
          elif [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "警告: Gitee 创建 Release 失败 (HTTP ${HTTP_CODE}): ${BODY}"
            exit 0
          fi

          RELEASE_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "警告: 无法获取 Release ID，跳过附件上传"
            exit 0
          fi

          # 上传附件
          for zip in artifacts/windows-build/*.zip artifacts/macos-build/*.zip; do
            if [ -f "$zip" ]; then
              echo "上传 $(basename $zip) 到 Gitee Release..."
              curl -s -X POST \
                "https://gitee.com/api/v5/repos/fentende125/sutan-game/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${zip}" || echo "警告: $(basename $zip) 上传失败"
            fi
          done
          echo "Gitee Release 完成"
