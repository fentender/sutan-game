name: Build & Test

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'csrc/**'
      - 'extern/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install . -v

      - name: Verify sultan_core import
        run: python -c "import sultan_core; print(f'sultan_core {sultan_core.__version__}')"

      - name: Verify sultan_core.diag
        run: python -c "from sultan_core import diag; print(diag.get_manager())"

      - name: C++ unit tests
        run: |
          pip install nanobind
          $nb_dir = python -c "import nanobind; print(nanobind.cmake_dir())"
          cmake -B build_test -DBUILD_TESTS=ON -Dnanobind_DIR="$nb_dir"
          cmake --build build_test --target sultan_tests --config Release
          ctest --test-dir build_test -C Release --output-on-failure

      - name: Python tests
        run: python -m tests --func

  build-macos:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install . -v

      - name: Verify sultan_core import
        run: python -c "import sultan_core; print(f'sultan_core {sultan_core.__version__}')"

      - name: Verify sultan_core.diag
        run: python -c "from sultan_core import diag; print(diag.get_manager())"

      - name: C++ unit tests
        run: |
          pip install nanobind
          nb_dir=$(python -c "import nanobind; print(nanobind.cmake_dir())")
          cmake -B build_test -DBUILD_TESTS=ON -Dnanobind_DIR="$nb_dir"
          cmake --build build_test --target sultan_tests --config Release
          ctest --test-dir build_test -C Release --output-on-failure

      - name: Python tests
        run: python -m tests --func
