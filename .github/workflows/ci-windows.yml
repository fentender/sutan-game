name: CI Windows

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/ci-macos.yml'
      - 'sudan_macos.spec'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install . -v

      - name: Verify sultan_core import
        run: python -c "import sultan_core; print(f'sultan_core {sultan_core.__version__}')"

      - name: C++ unit tests
        run: |
          pip install nanobind
          $nb_dir = python -c "import nanobind; print(nanobind.cmake_dir())"
          cmake -B build_test -DBUILD_TESTS=ON -Dnanobind_DIR="$nb_dir"
          cmake --build build_test --target sultan_tests --config Release
          ctest --test-dir build_test -C Release --output-on-failure

      - name: Python tests
        run: python -m tests --func

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install package
        run: pip install . -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build history config pack
        run: python packaging/build_history_pack.py

      - name: Extract version
        id: version
        shell: bash
        run: |
          ver=$(python -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('src/config.py', encoding='utf-8').read()).group(1))")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: PyInstaller build
        run: pyinstaller sudan.spec --noconfirm

      - name: Create zip
        shell: bash
        run: |
          cd dist
          7z a -tzip "../SuDanModMerger-Windows-V${{ steps.version.outputs.version }}.zip" SuDanModMerger/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: SuDanModMerger-Windows-V*.zip

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-build
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          ZIP_NAME="SuDanModMerger-Windows-V${VERSION}.zip"

          # 创建/更新 tag
          git tag -f "$TAG"
          git push origin "$TAG" --force

          # 检查 release 是否存在
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，替换 Windows 附件"
            gh release delete-asset "$TAG" "$ZIP_NAME" --yes 2>/dev/null || true
            gh release upload "$TAG" "artifacts/$ZIP_NAME"
          else
            echo "创建新 Release $TAG"
            gh release create "$TAG" \
              --title "[v${VERSION}] Mod 冲突合并工具" \
              --generate-notes \
              "artifacts/$ZIP_NAME"
          fi

      - name: Sync Gitee release
        if: env.GITEE_TOKEN != ''
        run: |
          ZIP_NAME="SuDanModMerger-Windows-V${VERSION}.zip"
          bash packaging/sync_gitee_release.sh "$VERSION" "artifacts/$ZIP_NAME"
